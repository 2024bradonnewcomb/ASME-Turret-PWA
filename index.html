<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turret HUD v2</title>
    <style>
        :root { --neon: #00ff41; --danger: #ff3e3e; }
        body {
            margin: 0; background: #000; color: var(--neon);
            font-family: 'Courier New', monospace; overflow: hidden;
            display: flex; flex-direction: column; height: 100dvh;
        }

        /* Viewfinder Section */
        #viewport {
            position: relative; width: 100%; height: 65dvh;
            background: #050505; overflow: hidden; border-bottom: 2px solid var(--neon);
        }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }

        /* Reticles */
        .center-cross {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; border: 1px solid rgba(0, 255, 65, 0.4);
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #aiming-dot {
            position: absolute; top: 50%; left: 50%;
            width: 14px; height: 14px; border: 2px solid var(--danger);
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--danger); pointer-events: none;
            z-index: 10; display: none;
        }

        /* Controls Section */
        #ui-panel {
            flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px;
            background: #0a0a0a; font-size: 12px; overflow-y: auto;
        }
        .stats { display: flex; justify-content: space-between; padding: 5px; background: rgba(0,255,65,0.1); border-radius: 4px; }
        
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding: 2px 0; }
        
        input {
            background: #000; color: var(--neon); border: 1px solid var(--neon);
            width: 55px; text-align: center; font-family: inherit;
        }

        #start-btn {
            background: var(--neon); color: #000; border: none; padding: 15px;
            font-weight: bold; text-transform: uppercase; cursor: pointer; width: 100%;
        }
        .out-of-range { color: var(--danger); }
    </style>
</head>
<body>

    <div id="viewport">
        <video id="camera-feed" autoplay playsinline></video>
        <div class="center-cross"></div>
        <div id="aiming-dot"></div>
    </div>

    <div id="ui-panel">
        <div class="stats">
            <div>PITCH: <span id="val-pitch">0</span>°</div>
            <div>REQ: <span id="val-req">--</span>°</div>
            <div>STATUS: <span id="status">OFFLINE</span></div>
        </div>

        <style>
            /* New styles for the preset grid */
            .presets-container {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 5px;
                margin-top: 10px;
            }
            .preset-btn {
                background: rgba(0, 255, 65, 0.2);
                border: 1px solid var(--neon);
                color: var(--neon);
                padding: 8px 2px;
                font-size: 10px;
                cursor: pointer;
                font-family: inherit;
            }
            .preset-btn:active {
                background: var(--neon);
                color: #000;
            }
        </style>

        <div id="presets" class="presets-container" style="display: none;">
            <button class="preset-btn" onclick="setDist(1.52)">Cent GR</button>
            <button class="preset-btn" onclick="setDist(2.62)">Side GR</button>
            <button class="preset-btn" onclick="setDist(3.23)">Side YE</button>
            <button class="preset-btn" onclick="setDist(5.03)">Cent BL</button>
            <button class="preset-btn" onclick="setDist(5.00)">Side BL</button>
            <button class="preset-btn" onclick="setDist(6.18)">Side PU</button>
            <button class="preset-btn" onclick="setDist(30)">30m</button>
            <button class="preset-btn" onclick="setDist(50)">50m</button>
        </div>

        <div class="input-grid">
            <div class="field"><label>DIST(m)</label><input type="number" id="in-dist" value="20"></div>
            <div class="field"><label>VEL(m/s)</label><input type="number" id="in-vel" value="14.6"></div>
            <div class="field"><label>CAM-Y(m)</label><input type="number" id="in-camy" value="0.18"></div>
            <div class="field"><label>FOV(°)</label><input type="number" id="in-fov" value="82"></div>
        </div>

        <button id="start-btn">Initialize System</button>
    </div>

    <script>
        const dot = document.getElementById('aiming-dot');
        const startBtn = document.getElementById('start-btn');
        const pitchDisp = document.getElementById('val-pitch');
        const reqDisp = document.getElementById('val-req');
        const statusDisp = document.getElementById('status');

        let currentPitch = 0;
        const G = 9.806;

        function updateHUD() {
            // 1. Get Inputs
            const dR = parseFloat(document.getElementById('in-dist').value) || 1; // Slant Range
            const v0 = parseFloat(document.getElementById('in-vel').value) || 1;
            const camUp = parseFloat(document.getElementById('in-camy').value) || 0;
            const vFOV = parseFloat(document.getElementById('in-fov').value) || 50;

            // 2. Convert current pitch to Radians
            const pitchRad = currentPitch * (Math.PI / 180);

            // 3. Inclined Time of Flight 
            // We use the slant range (dR) because that is the distance to target
            const timeOfFlight = dR / v0;

            // 4. Compensated Gravity Drop
            // Gravity drop only acts perpendicular to the bore at high angles
            const gravityDrop = 0.5 * G * Math.pow(timeOfFlight, 2) * Math.cos(pitchRad);
            
            // 5. Total Vertical Displacement (Parallax + Adjusted Drop)
            const totalDrop = gravityDrop + camUp;

            // 6. Angular Mapping (Rectilinear Projection)
            const dropAngleRad = Math.atan2(totalDrop, dR);
            const dropAngleDeg = dropAngleRad * (180 / Math.PI);

            const halfFOV = (vFOV / 2) * (Math.PI / 180);
            const screenOffset = (Math.tan(dropAngleRad) / Math.tan(halfFOV)) * 50;
            
            const finalY = 50 + screenOffset;

            // 7. Update UI
            if (finalY > 100 || finalY < 0) {
                statusDisp.innerText = "OUT OF VIEW";
                dot.style.display = "none";
            } else {
                statusDisp.innerText = "ACTIVE";
                dot.style.display = "block";
                dot.style.top = `${finalY}%`;
                
                // REQ is the angle you NEED to be at to hit the target.
                // It helps you see how much 'holdover' you are currently applying.
                reqDisp.innerText = (currentPitch + dropAngleDeg).toFixed(1);
            }
        }


        function handleMotion(e) {
            if (e.beta === null || e.gamma === null) return;

            // Convert degrees to radians for trigonometry
            const b = e.beta * (Math.PI / 180);
            const g = e.gamma * (Math.PI / 180);
            
            const angle = (window.screen && window.screen.orientation) ? 
                        window.screen.orientation.angle : (window.orientation || 0);

            let p = 0;

            if (Math.abs(angle) === 90) {
                // LANDSCAPE: Pitch is derived from Gamma, compensated by Beta (roll)
                // atan2(target_y, target_x)
                p = Math.atan2(Math.sin(g), Math.cos(g) * Math.cos(b)) * (180 / Math.PI);
                
                // Correct for left/right landscape orientation
                if (angle === -90) p = -p;
            } else {
                // PORTRAIT: Pitch is derived from Beta, compensated by Gamma (roll)
                // We subtract 90 to make the upright vertical position 0° (the horizon)
                p = (Math.atan2(Math.sin(b), Math.cos(b) * Math.cos(g)) * (180 / Math.PI)) - 90;
            }

            // currentPitch: Positive = Sky, Negative = Ground
            currentPitch = -p; 

            pitchDisp.innerText = currentPitch.toFixed(1);
            updateHUD();
        }

        async function start() {
            try {
                statusDisp.innerText = "STARTING...";

                // 1. Camera Request
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 } }
                });
                document.getElementById('camera-feed').srcObject = stream;

                // 2. Permission Request (iOS 13+ specific)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleMotion);
                    } else {
                        alert("Sensor access denied.");
                    }
                } else {
                    // Android or Desktop
                    window.addEventListener('deviceorientation', handleMotion);
                }

                startBtn.style.display = 'none';
                statusDisp.innerText = "ACTIVE";
            } catch (err) {
                console.error(err);
                alert("System Failure: " + err.name + " - " + err.message);
                statusDisp.innerText = "ERROR";
            }
        }

        startBtn.addEventListener('click', start);
        document.querySelectorAll('input').forEach(i => i.addEventListener('input', updateHUD));

        // 1. Function to set distance and refresh HUD
        function setDist(val) {
            document.getElementById('in-dist').value = val;
            updateHUD(); // Recalculate ballistics immediately
        }

        // 2. Add this line inside your existing async function start() 
        // right after 'startBtn.style.display = "none";'
        document.getElementById('presets').style.display = 'grid';
    </script>
</body>
</html>
