<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turret HUD v2</title>
    <style>
        :root { --neon: #00ff41; --danger: #ff3e3e; }
        body {
            margin: 0; background: #000; color: var(--neon);
            font-family: 'Courier New', monospace; overflow: hidden;
            display: flex; flex-direction: column; height: 100dvh;
        }

        /* Viewfinder Section */
        #viewport {
            position: relative; width: 100%; height: 65dvh;
            background: #050505; overflow: hidden; border-bottom: 2px solid var(--neon);
        }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }

        /* Reticles */
        .center-cross {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; border: 1px solid rgba(0, 255, 65, 0.4);
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #aiming-dot {
            position: absolute; top: 50%; left: 50%;
            width: 14px; height: 14px; border: 2px solid var(--danger);
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--danger); pointer-events: none;
            z-index: 10; display: none;
        }

        /* Controls Section */
        #ui-panel {
            flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px;
            background: #0a0a0a; font-size: 12px; overflow-y: auto;
        }
        .stats { display: flex; justify-content: space-between; padding: 5px; background: rgba(0,255,65,0.1); border-radius: 4px; }
        
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding: 2px 0; }
        
        input {
            background: #000; color: var(--neon); border: 1px solid var(--neon);
            width: 55px; text-align: center; font-family: inherit;
        }

        #start-btn {
            background: var(--neon); color: #000; border: none; padding: 15px;
            font-weight: bold; text-transform: uppercase; cursor: pointer; width: 100%;
        }
        .out-of-range { color: var(--danger); }
    </style>
</head>
<body>

    <div id="viewport">
        <video id="camera-feed" autoplay playsinline></video>
        <div class="center-cross"></div>
        <div id="aiming-dot"></div>
    </div>

    <div id="ui-panel">
        <div class="stats">
            <div>PITCH: <span id="val-pitch">0</span>°</div>
            <div>REQ: <span id="val-req">--</span>°</div>
            <div>STATUS: <span id="status">OFFLINE</span></div>
        </div>

        <div class="input-grid">
            <div class="field"><label>DIST(m)</label><input type="number" id="in-dist" value="20"></div>
            <div class="field"><label>VEL(m/s)</label><input type="number" id="in-vel" value="19.2"></div>
            <div class="field"><label>CAM-Y(m)</label><input type="number" id="in-camy" value="0.2"></div>
            <div class="field"><label>FOV(°)</label><input type="number" id="in-fov" value="82"></div>
        </div>

        <button id="start-btn">Initialize System</button>
    </div>

    <script>
        const dot = document.getElementById('aiming-dot');
        const startBtn = document.getElementById('start-btn');
        const pitchDisp = document.getElementById('val-pitch');
        const reqDisp = document.getElementById('val-req');
        const statusDisp = document.getElementById('status');

        let currentPitch = 0;
        const G = 9.806;

        function solveBallistics(x, y, v) {
            const v2 = v * v;
            const root = Math.pow(v, 4) - G * (G * (x * x) + 2 * y * v2);
            if (root < 0) return null;
            return Math.atan((v2 - Math.sqrt(root)) / (G * x)) * (180 / Math.PI);
        }

        function updateHUD() {
            const dH = parseFloat(document.getElementById('in-dist').value) || 1;
            const v0 = parseFloat(document.getElementById('in-vel').value) || 1;
            const camUp = parseFloat(document.getElementById('in-camy').value) || 0;
            const vFOV = parseFloat(document.getElementById('in-fov').value) || 50;

            // 1. How long does the bullet take to get there? (t = d / v)
            const timeOfFlight = dH / v0;

            // 2. How far does it fall in that time? (h = 0.5 * g * t^2)
            const gravityDrop = 0.5 * G * Math.pow(timeOfFlight, 2);

            // 3. Total vertical offset (Gravity drop + Camera height difference)
            // We ADD camUp because the camera being higher makes the impact look even lower
            const totalDrop = gravityDrop + camUp;

            // 4. Convert that linear drop into an angle (theta = arctan(drop / distance))
            const dropAngleRad = Math.atan2(totalDrop, dH);
            const dropAngleDeg = dropAngleRad * (180 / Math.PI);

            // 5. Map to screen
            // We use '+' to move the dot DOWN (higher % from top)
            const halfFOV = (vFOV / 2) * (Math.PI / 180);
            const screenOffset = (Math.tan(dropAngleRad) / Math.tan(halfFOV)) * 50;
            
            const finalY = 50 + screenOffset; // The '+' makes it sit below center

            if (finalY > 100 || finalY < 0) {
                statusDisp.innerText = "IMPACT OFF SCREEN";
                dot.style.display = "none";
            } else {
                statusDisp.innerText = "CALCULATED";
                dot.style.display = "block";
                dot.style.top = `${finalY}%`;
                reqDisp.innerText = (currentPitch + dropAngleDeg).toFixed(1);
            }
        }

        function handleMotion(e) {
            // Convert degrees to radians for math
            const beta = e.beta * (Math.PI / 180);
            const gamma = e.gamma * (Math.PI / 180);
            
            let p = 0;
            const orientation = window.orientation || (screen.orientation && screen.orientation.angle) || 0;

            if (orientation === 90 || orientation === -90) {
                /* LANDSCAPE FILTER:
                In landscape, gamma is your forward/back tilt (Pitch).
                Beta is your side-to-side rotation (Roll).
                We use atan(tan(gamma) / cos(beta)) to find the true pitch 
                relative to the horizon, effectively 'flattening' the roll.
                */
                const pitchRad = Math.atan(Math.tan(gamma) / Math.cos(beta));
                p = pitchRad * (180 / Math.PI);
                
                // Invert for Landscape-Right
                if (orientation === -90) p = -p;
                currentPitch = -p;
            } else {
                /* PORTRAIT FILTER */
                const pitchRad = Math.atan(Math.tan(beta) / Math.cos(gamma));
                p = (pitchRad * (180 / Math.PI)) - 90;
                currentPitch = -p;
            }

            pitchDisp.innerText = currentPitch.toFixed(1);
            updateHUD();
        }

        // In the start() function, revert back to deviceorientation:
        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 } }
                });
                document.getElementById('camera-feed').srcObject = stream;

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleMotion);
                    }
                } else {
                    window.addEventListener('deviceorientation', handleMotion);
                }

                startBtn.style.display = 'none';
                statusDisp.innerText = "ACTIVE";
            } catch (err) {
                alert("Setup error: " + err.message);
            }
        }
    </script>
</body>
</html>
