<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turret HUD</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #camera-container {
            position: relative;
            width: 100vw;
            height: 60vh;
            background: #000;
            overflow: hidden;
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Aiming Dot */
        #aiming-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: #ff3e3e;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ff3e3e;
            pointer-events: none;
        }

        /* Crosshair */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            border: 2px solid #00ff41;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: #00ff41;
        }

        .crosshair::before {
            width: 2px;
            height: 20px;
            top: -10px;
            left: 19px;
        }

        .crosshair::after {
            width: 20px;
            height: 2px;
            top: 19px;
            left: -10px;
        }

        #data-panel {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            background: rgba(0, 255, 65, 0.1);
            padding: 15px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .input-group label {
            min-width: 60px;
        }

        input[type="number"] {
            background: #000;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 5px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            width: 80px;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            box-shadow: 0 0 5px #00ff41;
        }

        button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            margin-top: 20px;
            text-transform: uppercase;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="camera-feed" autoplay playsinline></video>
        <div class="crosshair"></div>
        <div id="aiming-dot"></div>
    </div>

    <div id="data-panel">
        <div class="input-group">
            <label for="dist-x">DIST X:</label>
            <input type="number" id="dist-x" value="5" step="0.1" min="0">m
        </div>
        <div class="input-group">
            <label for="dist-y">DIST Y:</label>
            <input type="number" id="dist-y" value="0" step="0.1">m
        </div>
        <div>ELEVATION: <span id="val-elevation">0</span>°</div>
        <div>HEIGHT Z: <span id="val-height">0</span>m</div>
    </div>

    <button id="start-btn">Start Camera</button>

    <script>
        const cameraFeed = document.getElementById('camera-feed');
        const aimingDot = document.getElementById('aiming-dot');
        const elevationDisplay = document.getElementById('val-elevation');
        const heightDisplay = document.getElementById('val-height');
        const distXInput = document.getElementById('dist-x');
        const distYInput = document.getElementById('dist-y');
        const startBtn = document.getElementById('start-btn');

        let currentElevation = 0;
        let stream = null;

        // Calculate height using distance and elevation angle
        function calculateHeight() {
            const distX = parseFloat(distXInput.value) || 0;
            const distY = parseFloat(distYInput.value) || 0;
            const horizontalDistance = Math.sqrt(distX * distX + distY * distY);
            
            if (horizontalDistance === 0) {
                heightDisplay.innerText = "0.0";
                return;
            }
            
            // Height = horizontal_distance * tan(elevation_angle)
            const height = horizontalDistance * Math.tan(currentElevation * Math.PI / 180);
            heightDisplay.innerText = height.toFixed(2);
        }

        function handleOrientation(event) {
            if (event.beta === null) {
                return;
            }

            // Beta is pitch (-180 to 180)
            // Adjust so vertical position (beta = 90) is 0 elevation
            currentElevation = event.beta - 90;
            
            elevationDisplay.innerText = currentElevation.toFixed(1);
            calculateHeight();
        }

        async function startCamera() {
            try {
                // Request camera access
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment', // Use back camera
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });

                cameraFeed.srcObject = stream;
                
                // Request device orientation permission
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    } else {
                        alert("Orientation permission denied. Height calculation won't work.");
                    }
                } else {
                    // Non-iOS devices
                    window.addEventListener('deviceorientation', handleOrientation);
                }

                startBtn.innerText = "CAMERA ACTIVE";
                startBtn.disabled = true;

            } catch (error) {
                alert("Error accessing camera: " + error.message);
            }
        }

        // Update height when distance inputs change
        distXInput.addEventListener('input', calculateHeight);
        distYInput.addEventListener('input', calculateHeight);

        startBtn.addEventListener('click', startCamera);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
