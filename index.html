<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Turret HUD Pro</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh;
            box-sizing: border-box;
        }

        #camera-container {
            position: relative;
            width: 100vw;
            height: 60dvh;
            background: #000;
            overflow: hidden;
            flex-shrink: 0;
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Aiming Dot (Where to point the barrel) */
        #aiming-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: transparent;
            border: 2px solid #ff3e3e;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ff3e3e;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        /* Center Crosshair (Camera bore sight) */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            border: 1px solid rgba(0, 255, 65, 0.5);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #data-panel {
            flex: 1;
            width: 100%;
            background: #000;
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 10px;
            overflow-y: auto;
            border-top: 2px solid #00ff41;
        }

        .input-row { display: flex; align-items: center; justify-content: space-between; }
        input {
            background: #111;
            color: #00ff41;
            border: 1px solid #00ff41;
            width: 50px;
            font-size: 12px;
            text-align: center;
        }

        .status-box {
            grid-column: span 2;
            background: rgba(0, 255, 65, 0.1);
            padding: 5px;
            border: 1px solid #00ff41;
            text-transform: uppercase;
        }

        button {
            grid-column: span 2;
            background: #00ff41;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .out-of-range { color: #ff3e3e; font-weight: bold; }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="camera-feed" autoplay playsinline></video>
        <div class="crosshair"></div>
        <div id="aiming-dot"></div>
    </div>

    <div id="data-panel">
        <div class="status-box">
            System: <span id="sys-status">Standby</span><br>
            Target Z: <span id="val-height">0</span>m | 
            Req. Pitch: <span id="val-adj-elevation">0</span>°
        </div>

        <div class="input-row">
            <label>DIST H (m):</label>
            <input type="number" id="dist-h" value="50" step="1">
        </div>
        <div class="input-row">
            <label>MUZZLE V (m/s):</label>
            <input type="number" id="muzzle-vel" value="100" step="5">
        </div>
        <div class="input-row">
            <label>CAM UP (m):</label>
            <input type="number" id="cam-up" value="0.2" step="0.05">
        </div>
        <div class="input-row">
            <label>CAM FWD (m):</label>
            <input type="number" id="cam-fwd" value="0.1" step="0.05">
        </div>
        <div class="input-row">
            <label>CAM V-FOV (°):</label>
            <input type="number" id="cam-fov" value="60" step="1">
        </div>
        <div class="input-row">
            <label>CUR PITCH:</label>
            <span id="val-elevation">0</span>°
        </div>

        <button id="start-btn">Initialize HUD</button>
    </div>

    <script>
        const aimingDot = document.getElementById('aiming-dot');
        const elevationDisplay = document.getElementById('val-elevation');
        const adjElevationDisplay = document.getElementById('val-adj-elevation');
        const heightDisplay = document.getElementById('val-height');
        const sysStatus = document.getElementById('sys-status');
        
        // Inputs
        const inputs = ['dist-h', 'muzzle-vel', 'cam-up', 'cam-fwd', 'cam-fov'].reduce((acc, id) => {
            acc[id] = document.getElementById(id);
            return acc;
        }, {});

        let currentPitch = 0; // Device tilt relative to horizon
        const G = 9.806;

        function solveBallistics(x, y, v) {
            const v2 = v * v;
            const v4 = v2 * v2;
            const root = v4 - G * (G * (x * x) + 2 * y * v2);

            if (root < 0) return null; // Target out of range

            // We use the "-" for the low-trajectory solution (usually what turrets use)
            const angle = Math.atan((v2 - Math.sqrt(root)) / (G * x));
            return angle * (180 / Math.PI);
        }

        function update() {
            const dH = parseFloat(inputs['dist-h'].value) || 0;
            const v0 = parseFloat(inputs['muzzle-vel'].value) || 1;
            const camUp = parseFloat(inputs['cam-up'].value) || 0;
            const camFwd = parseFloat(inputs['cam-fwd'].value) || 0;
            const vFOV = parseFloat(inputs['cam-fov'].value) || 60;

            // 1. Where is the target in 3D space relative to the CAMERA?
            // currentPitch is negative if looking down, positive if looking up
            const targetZRelCam = dH * Math.tan(currentPitch * Math.PI / 180);
            heightDisplay.innerText = targetZRelCam.toFixed(2);

            // 2. Adjust target coordinates relative to the TURRET MUZZLE
            const x = dH + camFwd; 
            const y = targetZRelCam + camUp;

            // 3. Solve for required barrel angle
            const reqAngle = solveBallistics(x, y, v0);

            if (reqAngle === null) {
                sysStatus.innerText = "OUT OF RANGE";
                sysStatus.className = "status-box out-of-range";
                aimingDot.style.opacity = "0";
                adjElevationDisplay.innerText = "---";
            } else {
                sysStatus.innerText = "LOCKED";
                sysStatus.className = "status-box";
                aimingDot.style.opacity = "1";
                adjElevationDisplay.innerText = reqAngle.toFixed(1);

                // 4. Map the angle to the screen
                // We need to find the difference between where we are looking (currentPitch)
                // and where the barrel needs to point.
                const angleDiff = reqAngle - currentPitch;

                // Simple Linear mapping for small angles, but Tangent mapping is more accurate
                // screenPos = 50% - (tan(diff) / tan(FOV/2) * 50%)
                const halfFOV = (vFOV / 2) * (Math.PI / 180);
                const diffRad = angleDiff * (Math.PI / 180);
                
                const screenOffsetPercent = (Math.tan(diffRad) / Math.tan(halfFOV)) * 50;
                const finalY = 50 - screenOffsetPercent;

                aimingDot.style.top = `${Math.max(-10, Math.min(110, finalY))}%`;
            }
        }

        function handleOrientation(event) {
            // Beta is pitch. Usually 90 is vertical, 0 is flat. 
            // We want 0 to be the horizon.
            let pitch = event.beta; 
            
            // Adjust for typical phone holding (vertical-ish)
            // If phone is upright, beta is ~90. We subtract 90 to make horizon 0.
            currentPitch = pitch - 90;
            
            elevationDisplay.innerText = currentPitch.toFixed(1);
            update();
        }

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 } }
                });
                document.getElementById('camera-feed').srcObject = stream;

                if (DeviceOrientationEvent.requestPermission) {
                    const res = await DeviceOrientationEvent.requestPermission();
                    if (res === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
                
                document.getElementById('start-btn').style.display = 'none';
            } catch (e) {
                alert("Initialization failed: " + e.message);
            }
        }

        document.getElementById('start-btn').addEventListener('click', init);
        Object.values(inputs).forEach(input => input.addEventListener('input', update));
    </script>
</body>
</html>
